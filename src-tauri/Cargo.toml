[package]
name = "scribble-desktop"
version = "0.2.8"
description = "Scribble — desktop typing assistant (Tauri shell, Rust typing engine)"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "scribble_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time", "fs", "io-util", "net", "process"] }
once_cell = "1"
anyhow = "1"
rand = "0.8"
enigo = { version = "0.6", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
zip = "2.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
keyring = "3"
base64 = "0.22"
arboard = "3"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.18"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# Release builds favor a responsive typing loop over the smallest binary.
[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
incremental = false
